# Use this when a session produced reusable learning, exposed process friction,
# changed a harness contract, or revealed a repeated failure pattern.
#
# Do not use this for routine successful edits, command transcripts, personal
# preference, or notes that do not change future routing, proof, memory, docs,
# skills, hooks, or developer experience.
#
# Evidence required: cite a command, route result, changed file, validation
# failure, user correction, or repeated friction. If evidence is missing, write
# a short final-session note instead of durable reflection.

