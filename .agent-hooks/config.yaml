version: 1

paths:
  root: .agent-hooks
  logs: .agent-hooks/logs
  payloads: .agent-hooks/payloads
  artifacts: .agent-hooks/artifacts
  index_db: .agent-hooks/index/hooks.rusql
  vector_index_root: .agent-hooks/index/vectors

logging:
  schema_version: "1.0"
  rotate_by_date: true
  compact_min_size_bytes: 131072

redaction:
  key_substrings:
    - secret
    - token
    - password
    - api_key
    - authorization
    - cookie
  value_patterns:
    - "sk-[a-zA-Z0-9]{20,}"
    - "ghp_[a-zA-Z0-9]{36}"
    - "gho_[a-zA-Z0-9]{36}"
    - "xox[bpras]-[a-zA-Z0-9-]+"
    - "AKIA[0-9A-Z]{16}"
    - "-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----"

security:
  stdin_max_bytes: 10485760

hooks:
  timeout_seconds: 30

exports:
  otel_format: opentelemetry-compatible-json
  junit_suite_name: agent-hooks-observability
