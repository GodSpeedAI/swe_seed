[project]
name = "swe-seed"
version = "0.1.0"
description = "SWE_SEED CI/CD development harness"
requires-python = ">=3.12"
dependencies = [
    "baml-py>=0.222.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "live_proof: runs the live SWE_SEED harness proof command",
]
